<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CadCore — 3D Configurators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ─── Reset & tokens ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #0e0c09;
  --surface:  #161310;
  --s2:       #1e1a15;
  --s3:       #272018;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.14);
  --ink:      #f2e8d8;
  --ink2:     #c8b898;
  --ink3:     #786858;
  --acc:      #c8701a;
  --acc2:     #e8943a;
  --acc-dim:  rgba(200,112,26,0.15);
  --gold:     #c89030;
  --mono:     'DM Mono', monospace;
  --disp:     'Playfair Display', serif;
  --body:     'Montserrat', sans-serif;
  --tab-h:    52px;
  --nav-h:    68px;
}

html, body {
  height: 100%; width: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
}

/* ─── Shell layout ─── */
.shell {
  display: grid;
  grid-template-rows: var(--nav-h) var(--tab-h) 1fr;
  height: 100vh;
  min-height: 600px;
}

/* ─── Nav ─── */
.nav {
  display: flex;
  align-items: center;
  padding: 0 2.5rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  gap: 2.5rem;
  position: relative;
  z-index: 10;
  box-shadow: 0 2px 24px rgba(0,0,0,0.4);
}
.nav-logo {
  display: flex;
  align-items: baseline;
  gap: 10px;
  text-decoration: none;
}
.nav-logo-mark {
  font-family: var(--disp);
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--acc);
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.nav-logo-tagline {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--ink3);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding-bottom: 2px;
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 0.2rem;
  margin-left: 1rem;
}
.nav-link {
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--ink3);
  text-decoration: none;
  padding: 5px 12px;
  border-radius: 5px;
  letter-spacing: 0.04em;
  transition: color 0.15s, background 0.15s;
  cursor: pointer;
}
.nav-link:hover { color: var(--ink); background: var(--s2); }
.nav-link.active { color: var(--acc2); }
.nav-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 1rem;
}
.nav-cta {
  background: var(--acc);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 8px 20px;
  font-family: var(--body);
  font-size: 0.73rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  white-space: nowrap;
}
.nav-cta:hover { background: #a85c14; }
.nav-cta:active { transform: scale(0.97); }
.nav-badge {
  font-family: var(--mono);
  font-size: 0.6rem;
  background: var(--s3);
  border: 1px solid var(--border2);
  border-radius: 3px;
  padding: 3px 8px;
  color: var(--gold);
  letter-spacing: 0.06em;
}

/* ─── Tab bar ─── */
.tabbar {
  display: flex;
  align-items: stretch;
  background: var(--s2);
  border-bottom: 1px solid var(--border);
  padding: 0 2.5rem;
  gap: 0;
  position: relative;
  z-index: 9;
}
.tabbar::after {
  content: '';
  flex: 1;
  border-bottom: 2px solid transparent;
}

.tab {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 22px;
  font-size: 0.73rem;
  font-weight: 500;
  color: var(--ink3);
  cursor: pointer;
  border: none;
  background: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color 0.15s, border-color 0.15s;
  white-space: nowrap;
  letter-spacing: 0.03em;
  position: relative;
}
.tab:hover { color: var(--ink2); }
.tab.active {
  color: var(--acc2);
  border-bottom-color: var(--acc);
}
.tab-icon {
  width: 18px;
  height: 18px;
  opacity: 0.6;
  transition: opacity 0.15s;
}
.tab.active .tab-icon { opacity: 1; }

.tab-divider {
  width: 1px;
  background: var(--border);
  margin: 12px 0;
  flex-shrink: 0;
}

.tab-add {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 16px;
  font-size: 0.7rem;
  color: var(--ink3);
  cursor: pointer;
  border: none;
  background: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color 0.15s;
  font-family: var(--mono);
  letter-spacing: 0.06em;
  margin-left: auto;
}
.tab-add:hover { color: var(--acc2); }

/* ─── Content area ─── */
.content {
  position: relative;
  overflow: hidden;
  background: var(--bg);
}

.tab-panel {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.tab-panel.active {
  opacity: 1;
  pointer-events: auto;
}

/* Configurator iframes */
.cfg-iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* ─── Placeholder panels ─── */
.placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 1.5rem;
  background: radial-gradient(ellipse at 50% 40%, #1a1510 0%, #0e0c09 70%);
}
.ph-icon {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  background: var(--s3);
  border: 1px solid var(--border2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
}
.ph-title {
  font-family: var(--disp);
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--ink2);
  letter-spacing: 0.02em;
}
.ph-sub {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--ink3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.ph-btn {
  margin-top: .5rem;
  background: transparent;
  border: 1px solid var(--border2);
  border-radius: 7px;
  padding: 8px 22px;
  color: var(--ink3);
  font-family: var(--mono);
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.ph-btn:hover { border-color: var(--acc2); color: var(--acc2); }

/* ─── Loading overlay ─── */
.iframe-loader {
  position: absolute;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.2rem;
  transition: opacity 0.4s ease;
  pointer-events: none;
}
.iframe-loader.hidden { opacity: 0; }
.loader-ring {
  width: 36px; height: 36px;
  border: 2px solid var(--s3);
  border-top-color: var(--acc);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text {
  font-family: var(--mono);
  font-size: 0.62rem;
  color: var(--ink3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* ─── Footer strip ─── */

/* ─── Responsive ─── */
@media (max-width: 700px) {
  .nav { padding: 0 1rem; gap: 1rem; }
  .nav-links { display: none; }
  .tabbar { padding: 0 1rem; }
  .tab { padding: 0 14px; font-size: 0.68rem; }
}
</style>
</head>

  var b64  = CONFIGS[key];
  var blob = b64toBlob(b64, 'text/html');
  var url  = URL.createObjectURL(blob);
  var iframe = document.getElementById('iframe-' + key);
  var loader = document.getElementById('loader-' + key);

  iframe.onload = function() {
    loader.classList.add('hidden');
    setTimeout(function() { loader.style.display = 'none'; }, 450);
  };
  iframe.src = url;
}

function b64toBlob(b64, type) {
  var bytes = atob(b64);
  var len   = bytes.length;
  var arr   = new Uint8Array(len);
  for (var i = 0; i < len; i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr], { type: type });
}

/* ─── Tab switching ─── */
function switchTab(key) {
  if (key === active) return;
  active = key;

  // Update tab buttons
  document.querySelectorAll('.tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.tab === key);
  });

  // Update panels
  document.querySelectorAll('.tab-panel').forEach(function(p) {
    p.classList.toggle('active', p.id === 'panel-' + key);
  });

  // Lazy-load the iframe
  loadIframe(key);
}

/* ─── Wire tab clicks ─── */
document.querySelectorAll('.tab[data-tab]').forEach(function(btn) {
  btn.addEventListener('click', function() {
    switchTab(btn.dataset.tab);
  });
});

/* ─── "Add configurator" placeholder ─── */
document.getElementById('add-tab-btn').addEventListener('click', function() {
  alert('Drop your next configurator HTML file here to add it as a new tab.');
});

/* ─── Nav link active state ─── */
document.querySelectorAll('.nav-link').forEach(function(a) {
  a.addEventListener('click', function(e) {
    e.preventDefault();
    document.querySelectorAll('.nav-link').forEach(function(x) { x.classList.remove('active'); });
    a.classList.add('active');
  });
});

/* ─── Boot: load first tab immediately ─── */
loadIframe('gear');
</script>
</body>
</html>
